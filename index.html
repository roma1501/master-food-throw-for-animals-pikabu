<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Брось еду: ловля зверей</title>
    <link rel="icon" type="image/webp" href="assets/ui/icons/animals.webp">
    <style>
        @font-face { font-family: "Nunito"; src: url("assets/fonts/nunito.ttf") format("truetype"); font-weight: 200 1000; font-display: swap; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        /* --- экран загрузки «Master Food Throw for Animals» --- */
        #loading-screen { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: min(2.2vh, 16px);
            z-index: 1000; overflow: hidden; background: linear-gradient(#3fb4f5 0%, #7fd6ff 45%, #c6f0ff 72%, #c6f0ff 100%); font-family: 'Nunito', system-ui, sans-serif; color: #fff; }
        .ls-sky { position: absolute; inset: 0; pointer-events: none; }
        .ls-cloud { position: absolute; display: block; width: 180px; height: 56px; border-radius: 40px; background: #fff; opacity: .9; animation: lscloud 38s linear infinite;
            box-shadow: 40px -26px 0 6px #fff, 92px -10px 0 0 #fff, 0 8px 0 rgba(120,190,230,.35); }
        .ls-cloud.c1 { top: 12%; left: -20%; }
        .ls-cloud.c2 { top: 30%; left: -40%; transform: scale(.7); animation-duration: 52s; animation-delay: -20s; }
        .ls-cloud.c3 { top: 6%; left: -60%; transform: scale(1.2); animation-duration: 64s; animation-delay: -34s; }
        @keyframes lscloud { to { left: 120%; } }
        .ls-rays { position: absolute; left: 50%; top: 40%; width: 240vmax; height: 240vmax; transform: translate(-50%, -50%); pointer-events: none;
            background: repeating-conic-gradient(rgba(255,255,255,.22) 0deg 9deg, rgba(255,255,255,0) 9deg 18deg);
            -webkit-mask-image: radial-gradient(circle, #000 0, #000 8%, transparent 32%); mask-image: radial-gradient(circle, #000 0, #000 8%, transparent 32%); animation: grays 60s linear infinite; }
        .ls-ground { position: absolute; left: -20%; right: -20%; bottom: 0; height: 30%; transform: perspective(320px) rotateX(38deg); transform-origin: 50% 100%; pointer-events: none;
            background: repeating-conic-gradient(#5fdb48 0 25%, #4cc63a 0 50%) 0 0 / 72px 72px; border-top: 12px solid #8af06a; box-shadow: 0 -10px 0 #3aa82e; animation: lsground 3s linear infinite; }
        @keyframes lsground { to { background-position: 0 72px; } }
        .ls-pet { position: absolute; bottom: 4%; width: min(22vw, 20vh, 190px); pointer-events: none; filter: drop-shadow(0 8px 0 rgba(0,0,0,.25)); animation: lspet 1.6s ease-in-out infinite; }
        .ls-pet.p1 { left: 4%; } .ls-pet.p2 { right: 4%; --sx: -1; animation-delay: .4s; } .ls-pet.p3 { left: 24%; width: min(15vw, 14vh, 130px); animation-delay: .8s; } .ls-pet.p4 { right: 25%; width: min(16vw, 15vh, 140px); --sx: -1; animation-delay: 1.2s; }
        @keyframes lspet { 0%, 100% { transform: translateY(0) scaleX(var(--sx, 1)); } 50% { transform: translateY(-10px) scaleX(var(--sx, 1)); } }
        .ls-logo { position: relative; z-index: 1; }
        #loading-title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0; }
        .loading-bar { position: relative; z-index: 1; width: min(480px, 80vw); height: 36px; margin-top: min(4vh, 30px); border-radius: 20px; background: #1f2540; border: 5px solid #0d1022;
            box-shadow: 0 6px 0 rgba(0,0,0,.25), inset 0 4px 0 rgba(255,255,255,.08); }
        .loading-progress { position: relative; height: 100%; width: 0%; min-width: 26px; border-radius: 15px; transition: width .3s ease;
            background: repeating-linear-gradient(-45deg, #ffe23a 0 14px, #ffc21a 14px 28px); background-size: 40px 40px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.12), inset 0 5px 0 rgba(255,255,255,.45);
            animation: lsstripes .7s linear infinite; }
        @keyframes lsstripes { to { background-position: 40px 0; } }
        .ls-runner { position: absolute; right: -30px; bottom: 18px; width: 62px; height: 62px; object-fit: contain; filter: drop-shadow(0 4px 0 rgba(0,0,0,.3)); animation: lshop .36s ease-in-out infinite alternate; }
        @keyframes lshop { from { transform: translateY(0) rotate(-4deg); } to { transform: translateY(-9px) rotate(4deg); } }
        #loading-percent { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 1000; font-size: 20px; color: #fff;
            -webkit-text-stroke: 4px #1b1f2e; paint-order: stroke fill; pointer-events: none; }
        .loading-text { position: relative; z-index: 1; min-height: 1em; font-weight: 900; font-size: 18px; text-align: center; color: #fff; -webkit-text-stroke: 4px #1b3a5a; paint-order: stroke fill; }
        #loading-retry { position: relative; z-index: 1; padding: 10px 30px; border: 4px solid #0d4d14; border-radius: 14px; background: linear-gradient(#5fe36a, #22b13a); color: #fff;
            font: 1000 22px 'Nunito', system-ui, sans-serif; -webkit-text-stroke: 4px #0d4d14; paint-order: stroke fill; cursor: pointer; box-shadow: 0 5px 0 #0d4d14; }
        @media (max-height: 420px) { .ls-pet { display: none; } .loading-bar { height: 28px; } }
        /* --- логотип игры: экран загрузки и меню (GameUI) --- */
        @keyframes grays { to { transform: translate(-50%, -50%) rotate(360deg); } }
        .glogo { position: relative; display: inline-block; margin: 0 auto; transform: rotate(-3deg); }
        .glogo .w { display: flex; justify-content: center; align-items: flex-end; line-height: .86; white-space: nowrap; }
        .glogo .ch { position: relative; display: inline-block; font-weight: 1000; margin: 0 -.01em; animation: gbob 2.6s ease-in-out infinite; }
        .glogo .ch b { position: relative; z-index: 1; display: inline-block; font-weight: 1000; background: var(--fill); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .glogo .ch::before { content: attr(data-c); position: absolute; left: 0; top: 0; z-index: 0; color: var(--ol); -webkit-text-stroke: .2em var(--ol); paint-order: stroke fill;
          text-shadow: 0 .05em 0 var(--ol), 0 .09em 0 var(--ol), 0 .13em 0 var(--ol), 0 .19em .02em rgba(0,0,0,.35); }
        .glogo .ch::after { content: ''; position: absolute; z-index: 2; left: 18%; top: 14%; width: 22%; height: 14%; border-radius: 50%; background: rgba(255,255,255,.55); transform: rotate(-25deg); filter: blur(.5px); pointer-events: none; }
        @keyframes gbob { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-.06em) rotate(calc(var(--r, 0deg) * -1)); } }
        .glogo .w1 { font-size: min(5.4vw, 6.6vh, 48px); letter-spacing: .14em; margin-bottom: .1em; }
        .glogo .w1 .ch { animation: none; margin: 0 .02em; }
        .glogo .w2 { font-size: min(15vw, 19vh, 150px); }
        .glogo .w3 { font-size: min(12.5vw, 16vh, 124px); margin-top: .06em; }
        .glogo .plate { display: inline-block; padding: .06em .5em .16em; border-radius: .3em; background: linear-gradient(#3b2a6e, #22174a); border: .09em solid #12092b; box-shadow: 0 .12em 0 #12092b; }
        .glogo .ribbon { position: relative; display: inline-flex; align-items: center; gap: .3em; margin-top: .25em; padding: .14em 1.3em .2em; font-size: min(5.6vw, 7vh, 54px); font-weight: 1000; color: #fff;
          background: linear-gradient(#ff6bc4, #c42ad8); border-top: .07em solid #ffd0f0; box-shadow: 0 .12em 0 #5a0b6e, inset 0 -.12em 0 rgba(0,0,0,.18);
          clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%); -webkit-text-stroke: .16em #4a0a5e; paint-order: stroke fill; transform: rotate(2deg); }
        .glogo .ribbon img { width: 1.05em; height: 1.05em; filter: drop-shadow(0 .05em 0 rgba(0,0,0,.4)); }
        .glogo .deco { position: absolute; pointer-events: none; filter: drop-shadow(0 6px 0 rgba(0,0,0,.25)); animation: gfloat 3.2s ease-in-out infinite; }
        @keyframes gfloat { 0%, 100% { transform: translateY(0) rotate(var(--a, 0deg)) scaleX(var(--sx, 1)); } 50% { transform: translateY(-12px) rotate(calc(var(--a, 0deg) + 10deg)) scaleX(var(--sx, 1)); } }
        .glogo .spark { position: absolute; width: 24px; height: 24px; pointer-events: none; animation: gspark 1.8s ease-in-out infinite; }
        @keyframes gspark { 0%, 100% { transform: scale(.3) rotate(0); opacity: 0; } 50% { transform: scale(1) rotate(90deg); opacity: 1; } }
    </style>
</head>

            <div><span class="ribbon"><img src="assets/ui/icons/animals.webp" alt="">ловля зверей<img src="assets/ui/icons/animals.webp" alt=""></span></div>
        </div>

        <div class="loading-bar" id="loading-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress"><img class="ls-runner" src="assets/ui/animals/rabbit.webp" alt="" aria-hidden="true"></div><div id="loading-percent">0%</div></div>

    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
